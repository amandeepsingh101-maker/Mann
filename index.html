const bjV=c=>c.r==14?11:Math.min(c.r,10);

 const pt=bjT(BJ.P),dt=bjT(BJ.D),pb=BJ.P.length==2&&pt==21,db=BJ.D.length==2&&dt==21;let r,m;

function cbBot(i){

 const low=a=>a.reduce((x,y)=>y.r<x.r?y:x),high=a=>a.reduce((x,y)=>y.r>x.r?y:x),pick=a=>{const ns=a.filter(c=>c.s!=0);return low(ns.length?ns:a)};
 if(!t.length){
  const ns=L.filter(c=>c.s!=0);
  if(need>0){const big=ns.filter(c=>c.r>=13);if(big.length)return high(big);const sp=L.filter(c=>c.s==0&&c.r>=13);if(sp.length&&need>1)return high(sp)}
  return ns.length?low(ns):low(L);
 }
 let w=t[0];t.forEach(x=>{if((x.c.s==w.c.s&&x.c.r>w.c.r)||(x.c.s==0&&w.c.s!=0))w=x});
 const beats=c=>c.s==w.c.s?c.r>w.c.r:(c.s==0&&w.c.s!=0),win=L.filter(beats),lose=L.filter(c=>!beats(c));
 if(need>0){if(win.length)return low(win);return pick(L)}
 const ns2=lose.filter(c=>c.s!=0);
 return ns2.length?high(ns2):(lose.length?low(lose):low(L));
}
function cbR(){
 const T=CB,me=T.hands[0],play=T.ph=='play',t=play&&!T.busy?T.turn:-1,my=t==0,L=my?cbLegal(0):[];
 const fc=c=>`<div class='c ${cls(c)}'>${lab(c)}</div>`,n=me.length,step=n>1?Math.min(44,Math.floor(280/(n-1))):0;
 const hand=me.map((c,k)=>`<div class='c ${cls(c)} ${L.includes(c)?'ok':''}' style='margin-left:${k?step-60:0}px' onclick='cbTap(${k})'>${lab(c)}</div>`).join('');
 const slot=p=>{const x=T.trick.find(q=>q.p==p);return x?fc(x.c):`<div class='c ph'></div>`};
 const bidding=T.ph=='bid'||T.ph=='idle';
 const opp=i=>`<div class='pko ${t==i?'on':''}'><div class='av' style='background-color:${AVC[i]}'>${AV[i]}</div><b>${NM[i]}</b><small>${bidding?'total '+cbF(T.tot[i]):'bid '+T.bids[i]+' \u00b7 won '+T.won[i]}</small><small>total ${cbF(T.tot[i])}</small></div>`;
 let ctl='',msg=T.msg;
 if(T.ph=='idle'){ctl=`<button onclick='cbDeal()'>Deal \u00b7 5 rounds</button>`;msg='Bid how many tricks you will win. Spades \u2660 are always trump. Make your bid for +points, miss it and lose them.'}
 else if(T.ph=='bid'){ctl=`<div class='row'>${[1,2,3,4].map(n=>`<button onclick='cbBid(${n})'>${n}</button>`).join('')}</div><div class='row'>${[5,6,7,8].map(n=>`<button onclick='cbBid(${n})'>${n}</button>`).join('')}</div>`;msg='Your bid: how many tricks will you win? (est. '+Math.round(cbEst(me))+')'}
 else if(T.ph=='end'){ctl=`<button onclick='cbDeal()'>Next round</button>`;msg=T.res}
 else if(T.ph=='over'){ctl=`<button onclick='CB.rnd=0;CB.tot=[0,0,0,0];cbDeal()'>New game</button>`;msg=T.res}
 else{msg=(msg?msg+' \u00b7 ':'')+(my?'Your turn \u00b7 bid '+T.bids[0]+', won '+T.won[0]:(t>0?NM[t]+' is playing\u2026':''))}
 $('cb').innerHTML=`<div class='bjtop'><button onclick='cbClose()'>\u2190</button><b>Call Break \u00b7 ${Math.min(T.rnd+1,5)}/5</b><b>You ${cbF(T.tot[0])}</b></div>`+(T.ph!='idle'?`<div class='pkopp'>${[1,2,3].map(opp).join('')}</div>`:'')+`<div class='hhx'><div></div>${slot(2)}<div></div>${slot(1)}<div class='hhc' style='font-size:20px'>\u2660</div>${slot(3)}<div></div>${slot(0)}<div></div></div><div class='bjm' style='font-size:${T.ph=='play'?18:15}px'>${msg}</div><div class='cehand'>${hand}</div><div class='bjc'>${ctl}</div>`;
}

const FC={cols:[],cells:[null,null,null,null],found:[0,0,0,0],sel:null,moves:0,hist:[],ph:'idle',msg:'',st:{g:0,w:0}};
try{const v=JSON.parse(localStorage.getItem('hokmFC'));if(v)FC.st=v}catch(e){}
document.body.insertAdjacentHTML('beforeend','<div id="fc"></div>');
const fv=c=>c.r==14?1:c.r,fred=c=>c.s==1||c.s==2,fl=c=>(RK[c.r]||c.r)+SU[c.s];
function fcOpen(){hideMenu();FC.ph='idle';FC.msg='';FC.sel=null;$('fc').style.display='flex';fcR()}
function fcClose(){$('fc').style.display='none';showMenu('main')}
function fcDeal(){
 const d=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)d.push({s,r});for(let i=51;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 FC.cols=[[],[],[],[],[],[],[],[]];d.forEach((c,i)=>FC.cols[i%8].push(c));
 FC.cells=[null,null,null,null];FC.found=[0,0,0,0];FC.sel=null;FC.moves=0;FC.hist=[];FC.ph='play';FC.msg='';SFX.card();fcR();
}
function fcSnap(){FC.hist.push(JSON.stringify({c:FC.cols,l:FC.cells,f:FC.found,m:FC.moves}));if(FC.hist.length>300)FC.hist.shift()}
function fcUndo(){if(FC.ph!='play'||!FC.hist.length)return;const o=JSON.parse(FC.hist.pop());FC.cols=o.c;FC.cells=o.l;FC.found=o.f;FC.moves=o.m;FC.sel=null;FC.msg='';fcR()}
function fcSeq(col,idx){for(let i=idx;i<col.length-1;i++){const a=col[i],b=col[i+1];if(fv(a)!=fv(b)+1||fred(a)==fred(b))return false}return idx>=0&&idx<col.length}
function fcCap(dest){const free=FC.cells.filter(x=>!x).length,emp=FC.cols.filter((c,i)=>!c.length&&i!=dest).length;return (free+1)*Math.pow(2,emp)}
function fcTake(S){return S.t=='col'?FC.cols[S.a].splice(S.b):[FC.cells[S.a]]}
function fcRemove(S){if(S.t=='col')FC.cols[S.a].splice(S.b);else FC.cells[S.a]=null}
function fcWin(){if(FC.found.every(x=>x==13)){FC.ph='won';FC.st.g++;FC.st.w++;try{localStorage.setItem('hokmFC',JSON.stringify(FC.st))}catch(e){}SFX.fire();FC.msg='You solved it in '+FC.moves+' moves!'}}
function fcT(t,a,b){
 if(FC.ph!='play')return;
 const S=FC.sel;FC.msg='';
 if(!S){
  if(t=='col'){const col=FC.cols[a];if(b>=0&&col.length&&fcSeq(col,b))FC.sel={t:'col',a,b}}
  else if(t=='cell'&&FC.cells[a])FC.sel={t:'cell',a};
  fcR();return;
 }
 if(S.t==t&&S.a==a&&(t=='cell'||S.b==b)){FC.sel=null;fcR();return}
 const moving=S.t=='col'?FC.cols[S.a].slice(S.b):[FC.cells[S.a]];let ok=false;
 if(t=='col'){
  const dest=FC.cols[a];
  if(!(S.t=='col'&&S.a==a)){
   if(dest.length){const top=dest[dest.length-1],f=moving[0];ok=fv(top)==fv(f)+1&&fred(top)!=fred(f)}else ok=true;
   if(ok&&moving.length>fcCap(a))ok=false;
   if(ok){fcSnap();fcRemove(S);dest.push(...moving);FC.moves++;SFX.card()}
  }
  if(!ok){if(b>=0&&dest.length&&fcSeq(dest,b))FC.sel={t:'col',a,b};else{FC.sel=null;if(!(S.t=='col'&&S.a==a))SFX.opp()}}
  else FC.sel=null;
 }else if(t=='cell'){
  if(FC.cells[a]){FC.sel={t:'cell',a}}
  else if(moving.length==1&&S.t!='cell'){fcSnap();fcRemove(S);FC.cells[a]=moving[0];FC.moves++;FC.sel=null;SFX.card()}
  else FC.sel=null;
 }else{
  const c=moving[0];
  if(moving.length==1&&fv(c)==FC.found[c.s]+1){fcSnap();fcRemove(S);FC.found[c.s]++;FC.moves++;FC.sel=null;SFX.trick();fcWin()}
  else{FC.sel=null;SFX.opp()}
 }
 fcR();
}
function fcAuto(){
 if(FC.ph!='play')return;let moved=false,snap=false;
 for(;;){let m=false;
  const tops=[];FC.cols.forEach((col,i)=>{if(col.length)tops.push({t:'col',a:i,b:col.length-1,c:col[col.length-1]})});FC.cells.forEach((c,k)=>{if(c)tops.push({t:'cell',a:k,c})});
  for(const x of tops){if(fv(x.c)==FC.found[x.c.s]+1){if(!snap){fcSnap();snap=true}fcRemove(x);FC.found[x.c.s]++;FC.moves++;m=true;moved=true;break}}
  if(!m)break;
 }
 FC.sel=null;if(moved){SFX.trick();fcWin()}else FC.msg='Nothing to send up yet';fcR();
}
function fcR(){
 const T=FC,S=T.sel;
 const face=(c,x='')=>`<div class='fcc ${cls(c)} ${x}'>${fl(c)}</div>`;
 const cell=T.cells.map((c,k)=>`<div class='fcs' onclick='fcT("cell",${k},0)'>${c?`<div class='fcc ${cls(c)} ${S&&S.t=='cell'&&S.a==k?'sel':''}' style='top:-2px'>${fl(c)}</div>`:''}</div>`).join('');
 const found=[0,1,2,3].map(s=>`<div class='fcs' onclick='fcT("found",${s},0)' style='${s==1||s==2?'color:#ff8a80':''}'>${T.found[s]?`<div class='fcc ${cls({s,r:T.found[s]==1?14:T.found[s]})}' style='top:-2px'>${fl({s,r:T.found[s]==1?14:T.found[s]})}</div>`:SU[s]}</div>`).join('');
 const longest=Math.max(7,...T.cols.map(c=>c.length)),off=longest>14?17:longest>11?20:24;
 const cols=T.cols.map((col,ci)=>`<div class='fcol' style='height:${60+Math.max(0,col.length-1)*off}px' onclick='fcT("col",${ci},-1)'>${col.map((c,i)=>`<div class='fcc ${cls(c)} ${S&&S.t=='col'&&S.a==ci&&i>=S.b?'sel':''}' style='top:${i*off}px' onclick='event.stopPropagation();fcT("col",${ci},${i})'>${fl(c)}</div>`).join('')}</div>`).join('');
 let body;
 if(T.ph=='idle')body=`<div class='bjm' style='font-size:15px;padding:12px'>Move all cards to the four piles at the top, Ace to King by suit. Build down on the columns in alternating colors. Tap a card, then tap where it should go. Free cells hold one card each. (Solved ${T.st.w} of ${T.st.g})</div><div class='bjc'><button onclick='fcDeal()'>Deal</button></div>`;
 else body=`<div class='fct'><div class='fcg'>${cell}</div><div class='fcg'>${found}</div></div><div class='fcb'>${cols}</div><div class='bjm' style='font-size:16px'>${T.msg}</div>`+(T.ph=='won'?`<div class='bjc'><button onclick='fcDeal()'>New game</button></div>`:`<div class='row'><button onclick='fcUndo()'>Undo</button><button onclick='fcAuto()'>Auto \u2191</button><button onclick='fcDeal()'>New</button></div>`);
 $('fc').innerHTML=`<div class='bjtop'><button onclick='fcClose()'>\u2190</button><b>FreeCell</b><b>Moves ${T.moves}</b></div>`+body;
}

const UN={hands:[[],[],[],[]],draw:[],disc:[],color:0,dir:1,turn:0,ph:'idle',sc:[0,0,0,0],msg:'',gid:0,pend:null,drew:false,rnd:0,res:''};
document.body.insertAdjacentHTML('beforeend','<div id="un"></div>');
const unTop=()=>UN.disc[UN.disc.length-1];
const unCol=['#e53935','#f5c518','#43a047','#1e88e5'],unColN=['red','yellow','green','blue'];
const unSort=h=>h.sort((a,b)=>a.col-b.col||(a.k>b.k?1:a.k<b.k?-1:0)||(a.n||0)-(b.n||0));
const unSym=c=>({n:c.n,s:'\u2298',r:'\u21c4',d:'+2',w:'\u2605',f:'+4'})[c.k];
const unName=c=>(c.col==4?'':unColN[c.col]+' ')+(c.k=='w'?'wild':unSym(c));
const unCan=(c,hand)=>{if(c.col==4)return c.k=='w'||!hand.some(x=>x.col==UN.color);const t=unTop();return c.col==UN.color||(c.k==t.k&&(c.k!='n'||c.n==t.n))};
function unShuffle(d){for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}return d}
function unDeck(){const d=[];for(let col=0;col<4;col++){d.push({col,k:'n',n:0});for(let n=1;n<=9;n++)d.push({col,k:'n',n},{col,k:'n',n});for(const k of['s','r','d'])d.push({col,k},{col,k})}for(let i=0;i<4;i++)d.push({col:4,k:'w'},{col:4,k:'f'});return unShuffle(d)}
function unOpen(){hideMenu();UN.gid++;UN.ph='idle';UN.sc=[0,0,0,0];UN.rnd=0;UN.res='';UN.msg='';UN.hands=[[],[],[],[]];UN.disc=[];UN.draw=[];$('un').style.display='flex';unR()}
function unClose(){UN.gid++;$('un').style.display='none';showMenu('main')}
function unDeal(){
 const d=unDeck();UN.hands=[0,1,2,3].map(()=>unSort(d.splice(0,7)));
 let t=d.pop();while(t.k!='n'){d.unshift(t);t=d.pop()}
 UN.disc=[t];UN.draw=d;UN.color=t.col;UN.dir=1;UN.turn=UN.rnd%4;UN.ph='play';UN.msg='';UN.res='';UN.drew=false;UN.gid++;SFX.card();unNext();
}
function unTake(i,n){let last=null;for(let k=0;k<n;k++){if(!UN.draw.length&&UN.disc.length>1){const t=UN.disc.pop();UN.draw=unShuffle(UN.disc);UN.disc=[t]}if(UN.draw.length){last=UN.draw.pop();UN.hands[i].push(last)}}unSort(UN.hands[i]);return last}
function unNext(){unR();if(UN.ph=='play'&&UN.turn!=0){const g=UN.gid,t=UN.turn;setTimeout(()=>{if(g==UN.gid&&UN.turn==t&&UN.ph=='play')unBot(t)},1000)}}
function unPass(i){UN.drew=false;UN.turn=(i+UN.dir+4)%4;unNext()}
function unTap(k){if(UN.ph!='play'||UN.turn!=0)return;const h=UN.hands[0],c=h[k];if(!c||!unCan(c,h))return;if(c.col==4){UN.pend=c;UN.ph='color';unR();return}unPlay(0,c,null)}
function unPick(col){if(UN.ph!='color')return;UN.ph='play';unPlay(0,UN.pend,col)}
function unDrawBtn(){
 if(UN.ph!='play'||UN.turn!=0||UN.drew)return;
 const c=unTake(0,1);SFX.card();
 if(c&&unCan(c,UN.hands[0])){UN.drew=true;UN.msg='You drew a playable card';unR()}
 else{UN.msg='You drew a card and pass';unPass(0)}
}
function unPassBtn(){if(UN.ph=='play'&&UN.turn==0&&UN.drew)unPass(0)}
function unPickColor(i,c){if(c.col!=4)return null;const cnt=[0,0,0,0];UN.hands[i].forEach(x=>{if(x.col<4)cnt[x.col]++});return cnt.indexOf(Math.max(...cnt))}
function unBot(i){
 const h=UN.hands[i],pl=h.filter(c=>unCan(c,h));
 if(!pl.length){const c=unTake(i,1);UN.msg=NM[i]+' draws a card';SFX.card();if(c&&unCan(c,UN.hands[i]))return unPlay(i,c,unPickColor(i,c));return unPass(i)}
 const nx=UN.hands[(i+UN.dir+4)%4].length;
 let pool=pl.filter(c=>c.col!=4);if(!pool.length)pool=pl;
 const act=pool.filter(c=>c.k!='n');
 let c;
 if(nx<=2&&act.length)c=act[0];
 else{const cnt=[0,0,0,0];h.forEach(x=>{if(x.col<4)cnt[x.col]++});pool=pool.slice().sort((a,b)=>(cnt[b.col]||0)-(cnt[a.col]||0)||((b.n||0)-(a.n||0)));c=pool[0]}
 unPlay(i,c,unPickColor(i,c));
}
function unPlay(i,c,cc){
 const h=UN.hands[i];h.splice(h.indexOf(c),1);UN.disc.push(c);UN.color=c.col==4?cc:c.col;UN.drew=false;
 let step=1,msg=NM[i]+' plays '+unName(c);
 if(c.k=='r'){UN.dir*=-1;msg+=' \u2014 reverse!'}
 else if(c.k=='s'){step=2;msg+=' \u2014 skip!'}
 else if(c.k=='d'){unTake((i+UN.dir+4)%4,2);step=2;msg+=' \u2014 next draws 2'}
 else if(c.k=='f'){unTake((i+UN.dir+4)%4,4);step=2;msg+=' \u2014 next draws 4'}
 if(c.col==4)msg+=' \u2192 '+unColN[UN.color];
 if(c.k!='n')SFX.slap();else SFX.card();
 UN.msg=msg;
 if(!h.length)return unEnd(i);
 if(h.length==1){UN.msg+=' \u00b7 UNO!';SFX.trick()}
 UN.turn=(((i+UN.dir*step)%4)+4)%4;unNext();
}
function unEnd(w){
 const val=c=>c.k=='n'?c.n:(c.k=='w'||c.k=='f'?50:20);
 const pts=UN.hands.reduce((a,h,i)=>i==w?a:a+h.reduce((x,c)=>x+val(c),0),0);
 UN.sc[w]+=pts;UN.rnd++;UN.ph='end';UN.res=NM[w]+' wins the round: +'+pts;
 if(Math.max(...UN.sc)>=100){UN.ph='over';const m=Math.max(...UN.sc),ww=UN.sc.indexOf(m);UN.res=(ww==0?'You win the game! ':NM[ww]+' wins the game. ')+UN.sc.map((s,i)=>NM[i]+' '+s).join(' \u00b7 ');if(ww==0)SFX.fire();else SFX.boo()}
 else{if(w==0)SFX.win();else SFX.opp()}
 unR();
}
function unCard(c,ex,at){const s=unSym(c);return `<div class='uc u${c.col} ${ex||''}' ${at||''}><small>${s}</small>${s}</div>`}
function unR(){
 const T=UN,me=T.hands[0],my=T.ph=='play'&&T.turn==0,top=T.disc.length?unTop():null,n=me.length,step=n>1?Math.min(46,Math.floor(280/(n-1))):0;
 const hand=me.map((c,k)=>unCard(c,my&&unCan(c,me)?'ok':'',`style='margin-left:${k?step-60:0}px' onclick='unTap(${k})'`)).join('');
 const opp=i=>`<div class='pko ${T.ph=='play'&&T.turn==i?'on':''}'><div class='av' style='background-color:${AVC[i]}'>${AV[i]}</div><b>${NM[i]}</b><small>${T.sc[i]} pts</small><small>${T.hands[i].length} cards${T.hands[i].length==1?' \u00b7 UNO!':''}</small></div>`;
 let ctl='',msg=T.msg;
 if(T.ph=='idle'){ctl=`<button onclick='unDeal()'>Deal \u00b7 first to 100 wins</button>`;msg='Match the color or the number. Action cards and wilds shake things up. Be first to empty your hand!'}
 else if(T.ph=='color'){ctl=`<div class='row'>${[0,1,2,3].map(k=>`<button onclick='unPick(${k})' style='background:${unCol[k]};color:#fff'>${unColN[k]}</button>`).join('')}</div>`;msg='Choose a color'}
 else if(T.ph=='play'){if(my)ctl=`<div class='row'><button onclick='unDrawBtn()' ${T.drew?'disabled':''}>Draw a card</button>${T.drew?`<button onclick='unPassBtn()'>Pass</button>`:''}</div>`;msg=(msg?msg+' \u00b7 ':'')+(my?'Your turn':NM[T.turn]+' is playing\u2026')}
 else if(T.ph=='end'){ctl=`<button onclick='unDeal()'>Next round</button>`;msg=T.res}
 else{ctl=`<button onclick='UN.sc=[0,0,0,0];UN.rnd=0;unDeal()'>New game</button>`;msg=T.res}
 $('un').innerHTML=`<div class='bjtop'><button onclick='unClose()'>\u2190</button><b>Color Match</b><b>You ${T.sc[0]}</b></div>`+(T.ph!='idle'?`<div class='pkopp'>${[1,2,3].map(opp).join('')}</div>`:'')+`<div class='cex'><div class='cep'><div class='uc ub' onclick='unDrawBtn()'>\ud83c\udfb4</div><small>Draw ${T.draw.length}</small></div><div class='cep'>${top?unCard(top):''}<small>${T.dir>0?'\u21bb':'\u21ba'} <span style='display:inline-block;width:18px;height:18px;border-radius:50%;background:${unCol[T.color]};border:2px solid #fff;vertical-align:middle'></span></small></div></div><div class='bjm' style='font-size:15px'>${msg}</div><div class='uhand'>${hand}</div><div class='bjc'>${ctl}</div>`;
}

const LD={dice:[[],[],[],[]],n:[5,5,5,5],bid:null,turn:0,ph:'idle',msg:'',gid:0,start:0,res:'',q:1,f:2,rev:null};

const ldNextAlive=i=>{let j=(i+1)%4,k=0;while(!ldAlive(j)&&k++<4)j=(j+1)%4;return j};
const ldC=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r};
const ldP=(others,need)=>{if(need<=0)return 1;if(need>others)return 0;let p=0;for(let k=need;k<=others;k++)p+=ldC(others,k)*Math.pow(1/3,k)*Math.pow(2/3,others-k);return p};

 LD.bid=null;LD.rev=null;LD.turn=LD.start;LD.ph='bid';LD.msg='New round \u2014 '+(LD.start==0?'you start':NM[LD.start]+' starts');LD.gid++;ldDefault();SFX.card();ldNext();
}
function ldNext(){ldR();if(LD.ph=='bid'&&LD.turn!=0){const g=LD.gid,t=LD.turn;setTimeout(()=>{if(g==LD.gid&&LD.turn==t&&LD.ph=='bid')ldBot(t)},1100)}}
function ldBid(i,q,f){
 LD.bid={q,f,by:i};LD.msg=NM[i]+' bids '+q+' \u00d7 '+ldFace(f);SFX.card();
 LD.turn=ldNextAlive(i);ldDefault();ldNext();
}
function ldCall(i){
 if(!LD.bid)return;
 const {q,f,by}=LD.bid,cnt=LD.dice.reduce((a,d)=>a+d.filter(x=>x==f||x==1).length,0);
 const bidTrue=cnt>=q,loser=bidTrue?i:by;
 LD.n[loser]--;LD.ph='reveal';LD.rev={q,f,cnt,caller:i,by,loser};LD.start=LD.n[loser]>0?loser:ldNextAlive(loser);
 LD.msg=NM[i]+' calls LIAR! There were '+cnt+' \u00d7 '+ldFace(f)+' (1s are wild) \u2014 '+NM[loser]+' loses a die';
 SFX.slap();
 if(loser==0)SFX.opp();else SFX.trick();
 if(LD.n[0]==0){LD.ph='over';LD.res='You are out of dice. '+NM[[1,2,3].find(ldAlive)||1]+' keeps playing \u2014 better luck next time!';SFX.boo()}
 else if([1,2,3].every(j=>!ldAlive(j))){LD.ph='over';LD.res='You win! All opponents are out of dice \ud83c\udf89';SFX.fire()}
 ldR();
}
function ldNextRound(){if(LD.ph=='reveal')ldRound()}
function ldHBid(){if(LD.ph!='bid'||LD.turn!=0||!ldOk(LD.q,LD.f))return;ldBid(0,LD.q,LD.f)}
function ldHCall(){if(LD.ph!='bid'||LD.turn!=0||!LD.bid)return;ldCall(0)}
function ldSetQ(d){LD.q=Math.max(1,Math.min(ldTot(),LD.q+d));ldR()}
function ldSetF(f){LD.f=f;ldR()}
function ldBot(i){
 const me=LD.dice[i],tot=ldTot(),others=tot-me.length,own=f=>me.filter(d=>d==f||d==1).length;
 if(LD.bid){const {q,f}=LD.bid,p=ldP(others,q-own(f));if(p<.28+Math.random()*.12)return ldCall(i)}
 const c=[];for(let q=1;q<=tot;q++)for(let f=2;f<=6;f++){if(!ldOk(q,f))continue;c.push({q,f,p:ldP(others,q-own(f)),own:own(f)})}
 if(!c.length)return ldCall(i);
 let pool=c.filter(x=>x.p>=.45);if(!pool.length)pool=c.slice(0,3);
 let best=null,bs=1e9;pool.forEach(x=>{const s=x.q-x.own*.8+Math.random()*1.4+(x.q-(LD.bid?LD.bid.q:0))*.5;if(s<bs){bs=s;best=x}});
 ldBid(i,best.q,best.f);
}
function ldR(){
 const T=LD,my=T.ph=='bid'&&T.turn==0,rev=T.ph=='reveal'||T.ph=='over'&&T.rev;
 const die=(v,x='')=>`<div class='die ${x}'>${ldFace(v)}</div>`;
 const opp=i=>`<div class='pko ${T.ph=='bid'&&T.turn==i?'on':''}'><div class='av' style='background-color:${AVC[i]}'>${AV[i]}</div><b>${NM[i]}${T.n[i]?'':' (out)'}</b><small>${T.n[i]} dice</small><div class='pkh' style='flex-wrap:wrap'>${(rev||T.ph=='over')&&T.dice[i]?T.dice[i].map(v=>die(v,'ds'+((T.rev&&(v==T.rev.f||v==1))?' hit':''))).join(''):Array.from({length:T.n[i]},()=>`<div class='die ds hid'>?</div>`).join('')}</div></div>`;
 const mine=(T.dice[0]||[]).map(v=>die(v,T.rev&&(v==T.rev.f||v==1)?'hit':'')).join('');
 let ctl='',msg=T.msg;
 const bidTxt=T.bid?`<div style='font-size:15px'>Current bid</div><div style='font-size:34px;font-weight:900'>${T.bid.q} \u00d7 ${ldFace(T.bid.f)}</div><small>by ${NM[T.bid.by]}</small>`:`<div style='font-size:20px;font-weight:800'>No bid yet</div>`;
 if(T.ph=='idle'){ctl=`<button onclick='ldStart()'>Start game</button>`;msg='Everyone rolls 5 dice in secret. Take turns bidding how many dice of a face are on the whole table (1s are wild). Raise the bid or call LIAR! Lose a die when you are wrong. Last player with dice wins.'}
 else if(T.ph=='reveal'){ctl=`<button onclick='ldNextRound()'>Next round</button>`}
 else if(T.ph=='over'){ctl=`<button onclick='ldStart()'>New game</button>`;msg=(T.msg?T.msg+' \u00b7 ':'')+T.res}
 else if(my){
  const ok=ldOk(T.q,T.f);
  ctl=`<div class='row'><button onclick='ldSetQ(-1)'>\u2212</button><b style='flex:2;font-size:26px;text-align:center'>${T.q} \u00d7 ${ldFace(T.f)}</b><button onclick='ldSetQ(1)'>+</button></div><div class='row'>${[2,3,4,5,6].map(f=>`<button class='${T.f==f?'sel':''}' onclick='ldSetF(${f})' style='font-size:24px'>${ldFace(f)}</button>`).join('')}</div><div class='row'><button onclick='ldHBid()' ${ok?'':'disabled'}>Bid</button>${T.bid?`<button onclick='ldHCall()' style='background:#e53935;color:#fff'>Liar!</button>`:''}</div>`;
  msg=(msg?msg+' \u00b7 ':'')+'Your turn';
 }else msg=(msg?msg+' \u00b7 ':'')+NM[T.turn]+' is thinking\u2026';
 $('ld').innerHTML=`<div class='bjtop'><button onclick='ldClose()'>\u2190</button><b>Liar\u2019s Dice</b><b>You: ${T.n[0]} dice</b></div>`+(T.ph!='idle'?`<div class='pkopp'>${[1,2,3].map(opp).join('')}</div>`:'')+`<div class='cex' style='flex-direction:column;align-items:center;text-align:center'>${bidTxt}</div><div class='bjm' style='font-size:15px'>${msg}</div><div class='ldm pkh'>${mine}</div><div class='bjc'>${ctl}</div>`;
}

let drag=null;
const inZone=e=>{const r=$('tbl').getBoundingClientRect();return (e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)||e.clientY<$('hand').getBoundingClientRect().top-30};
function dstart(e,i){
 if(drag||busy||turn!=0||trump===null)return;
 const c=hands[0][i];if(!c||!legal(0).includes(c))return;
 e.preventDefault();
 const el=e.currentTarget,r=el.getBoundingClientRect(),g=el.cloneNode(true);
 g.className='c '+cls(c);
 g.style.cssText=`position:fixed;left:${e.clientX-35}px;top:${e.clientY-70}px;margin:0;z-index:20;pointer-events:none;box-shadow:0 4px 8px rgba(0,0,0,.5)`;
 document.body.appendChild(g);el.classList.add('dg');
 drag={g,el,i,sx:e.clientX,sy:e.clientY,ox:e.clientX-35,oy:e.clientY-70,moved:false};
 try{el.setPointerCapture(e.pointerId)}catch(x){}
 el.onpointermove=dmove;el.onpointerup=dend;el.onpointercancel=dstop;
}
function dmove(e){const d=drag;if(!d)return;const dx=e.clientX-d.sx,dy=e.clientY-d.sy;if(Math.hypot(dx,dy)>8)d.moved=true;d.g.style.left=d.ox+dx+'px';d.g.style.top=d.oy+dy+'px';$('tbl').classList.toggle('hot',d.moved&&inZone(e))}
function dstop(){const d=drag;if(!d)return;d.g.remove();d.el.classList.remove('dg');drag=null;$('tbl').classList.remove('hot');if(hands)render()}
function dend(e){const d=drag;if(!d)return;const ok=!d.moved||inZone(e),i=d.i;dstop();if(ok)human(i)}
applyMat();showMenu('main');
</script><script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(function(){});</script></body></html>
